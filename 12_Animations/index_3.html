<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animation Example 3</title>
    <style>
        section {
            width: 200px;
            height: 200px;
            background-color: red;
            animation-name: test;
            animation-duration: 5s;
            position: relative;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
        }

        @keyframes test {
            from {
                left: 0;
            }
            to {
                left: 500px;
            }
        }
    </style>
</head>
<body>
<section>

</section>
</body>
</html>
