<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animation Example 3</title>
    <style>
        section {
            width: 200px;
            height: 200px;
            background-color: red;
            animation-name: test;
            animation-duration: 5s;
            position: relative;
            animation-iteration-count: 2; /*1..9 | infinite*/
            animation-direction: alternate; /*reverse | alternate | alternate-reverse*/

            /*last frame hold after ending the round*/
            animation-fill-mode: both; /* none | forwards | backwards | both */

            /*animation-delay: 5s;*/
        }

        @keyframes test {
            from {
                left: 0;
                background-color: yellow;
            }
            to {
                left: 500px;
                background-color: green;
            }
        }
    </style>
</head>
<body>
<section>

</section>
</body>
</html>
